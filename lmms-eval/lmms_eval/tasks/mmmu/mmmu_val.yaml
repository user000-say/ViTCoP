dataset_path: /home/xiangyue/ViTCoP/datasets_local/mmmu_val
dataset_kwargs:
  load_from_disk: true
task: "mmmu_val"
test_split: validation
output_type: generate_until
# LLaVA-1.5 + e006 span require a single <image> token; multi-image MMMU
# samples are concatenated (lmms-eval group_img path) under the same task name.
doc_to_visual: !function utils_group_img.mmmu_doc_to_visual
doc_to_text: !function utils_group_img.mmmu_doc_to_text
doc_to_target: "answer"
process_results: !function utils_group_img.mmmu_process_results

metric_list:
  - metric: mmmu_acc
    aggregation: !function utils_group_img.mmmu_aggregate_results
    higher_is_better: true

generation_kwargs:
  max_new_tokens: 16
model_specific_generation_kwargs:
  llava:
    image_aspect_ratio: original

metadata:
  version: 0.0
  interleaved_format: false
  mmmu_visual_mode: group_img
